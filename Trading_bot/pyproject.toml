[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-futures-testnet-bot"
version = "1.0.0"
description = "Simplified Binance USDT-M Futures Testnet order CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "python-dotenv>=1.0.0",
  "streamlit>=1.32.0",
]

[project.scripts]
trading-bot = "bot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*"]
